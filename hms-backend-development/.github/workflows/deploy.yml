name: Deploy Backend to ECS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Debug - List files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in directory:"
          ls -la
          echo "Dockerfile exists?"
          ls -la Dockerfile 2>/dev/null || echo "Dockerfile not found!"
      
      - name: Setup Node.js 22.21.1
        uses: actions/setup-node@v3
        with:
          node-version: '22.21.1'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t hms-backend:latest .
          docker tag hms-backend:latest ${{ secrets.ECR_REGISTRY }}/hms-backend:latest
      
      - name: Push image to Amazon ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/hms-backend:latest
          docker tag hms-backend:latest ${{ secrets.ECR_REGISTRY }}/hms-backend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/hms-backend:${{ github.sha }}
      
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster hms-cluster \
            --service hms-backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
